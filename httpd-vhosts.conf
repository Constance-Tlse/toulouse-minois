<VirtualHost *:80>
    ServerName minois.anamnesis.ovh
    ServerAlias www.minois.anamnesis.ovh
    Redirect permanent / https://minois.anamnesis.ovh/
</VirtualHost>

<VirtualHost *:443>
    ServerName minois.anamnesis.ovh
    ServerAlias www.minois.anamnesis.ovh
    ServerAdmin webmaster@localhost
    DocumentRoot "/usr/local/apache2/htdocs"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/minois.anamnesis.ovh/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/minois.anamnesis.ovh/privkey.pem

    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>