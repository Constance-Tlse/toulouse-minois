name: Deploy Minois Front-End

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

  workflow_dispatch:

env:
  SSH_HOST: 10.10.10.4
  SSH_USER: deployer-front
  APP_DIR_SNAILFRONT: /home/deployer-front/minois
  REGISTRY_USERNAME: ${{ secrets.GHCR_USERNAME }}
  REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}

jobs:
  minois-front-end-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Key and Connect to SnailFront
        id: ssh_to_snailfront
        run: |
          echo "DEBUG: Configuration de la clé SSH..."
          mkdir -p ~/.ssh
          # Sauvegarde la clé privée du secret GitHub dans un fichier temporaire
          # C'est ICI que la clé est créée A CHAQUE FOIS à partir du secret.
          # Elle n'a pas besoin d'être présente sur SnailWeb en permanence.
          echo "${{ secrets.SSH_PRIVATE_KEY_SNAILFRONT }}" > ~/.ssh/snailfront_deploy_key
          chmod 600 ~/.ssh/snailfront_deploy_key

          echo "DEBUG: Test de connexion SSH à SnailFront..."
          # Tente la connexion SSH. Le 'set -euxo pipefail' dans le script distant gérera les erreurs.
          ssh -i ~/.ssh/snailfront_deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${{ env.SSH_USER }}"@"${{ env.SSH_HOST }}" \
              "bash -s" << 'EOF_SSH'
          # --- Commandes exécutées sur SnailFront ---
          # Active le mode débogage et fait échouer le script à la première erreur
          set -euxo pipefail

            echo "DEBUG: Connexion à GHCR..."
            echo "${{ secrets.Minois_deploy }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            echo "DEBUG: Connexion GHCR réussie."

            echo "DEBUG: Création du répertoire de l'application et déplacement..."
            mkdir -p ${{ env.APP_DIR_SNAILFRONT }}
            cd ${{ env.APP_DIR_SNAILFRONT }}
            echo "DEBUG: Répertoire actuel sur SnailFront : $(pwd)"
            echo "DEBUG: Contenu du répertoire avant création de docker-compose.yml :"
            ls -la

            echo "DEBUG: Création de docker-compose.yml..."
            cat << 'DOCKER_COMPOSE_EOF' > docker-compose.yml
            version: '3.8'
            services:
              minois-frontend:
                image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}
                container_name: minois-frontend
                restart: unless-stopped
                ports:
                  - "80:80"
                environment:
                  - API_URL=http://10.10.10.3:VOTRE_PORT_BACKEND # <<< N'oubliez pas de remplacer VOTRE_PORT_BACKEND
            DOCKER_COMPOSE_EOF
            echo "DEBUG: docker-compose.yml créé. Contenu :"
            cat docker-compose.yml # <<< VÉRIFIE LE CONTENU DU FICHIER
            ls -la # <<< VÉRIFIE L'EXISTENCE ET LES PERMISSIONS

            echo "DEBUG: Pull de l'image Docker..."
            docker compose pull
            echo "DEBUG: Image téléchargée. Lancement des conteneurs..."
            docker compose up -d --remove-orphans
            echo "DEBUG: Conteneurs lancés. Nettoyage des images..."
            docker image prune -f
            echo "DEBUG: Déconnexion de GHCR..."
            docker logout ghcr.io
            echo "DEBUG: Déploiement sur SnailFront terminé."
            EOF

            rm ~/.ssh/snailfront_deploy_key
