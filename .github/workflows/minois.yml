name: CI/CD for Minois Front-End

on:
  # Déclenche le déploiement quand du code est poussé sur la branche 'staging'
  push:
    branches:
      - staging
  # Déclenche les tests quand une Pull Request est ouverte vers 'staging'
  pull_request:
    branches:
      - staging
  # Permet de lancer le workflow manuellement depuis l'interface GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: toulouse-minois
  APP_DIR_SNAILFRONT: /home/deployer-front/minois

jobs:
  # --- JOB 1: S'exécute sur les Pull Requests pour vérifier la qualité du code ---
  test:
    name: Lint and Test Code
    # Ne s'exécute que pour les événements de type 'pull_request'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Assurez-vous que cette version correspond à celle de votre Dockerfile
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install client dependencies
        run: npm install --workspace=client

      - name: Run Biome code quality check
        run: npm run check --workspace=client

  # --- JOB 2: Construit et pousse l'image Docker après un push sur 'staging' ---
  build:
    name: Build and Push Docker Image
    # Ne s'exécute que sur un push ou un déclenchement manuel
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Requis pour l'authentification OIDC

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.MINOIS_DEPLOY }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix={{branch}}-,suffix=,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_REACT_APP_HARVARD_MUSEUM_API=${{ secrets.VITE_REACT_APP_HARVARD_MUSEUM_API }}

  # --- JOB 3: Déploie l'image sur la VM finale ---
  deploy:
    name: Deploy to SnailFront
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment: production

    # CORRECTION: Ajout des permissions pour pouvoir tirer (pull) l'image
    permissions:
      packages: read # Requis pour tirer (pull) l'image depuis GHCR

    steps:
      - name: Deploy to SnailFront via SnailWeb (Jump Host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAILFRONT_PRIVATE_IP }}
          username: ${{ secrets.SNAILFRONT_DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SNAILFRONT }}
          port: 96

          proxy_host: ${{ secrets.SNAILWEB_HOST }}
          proxy_username: ${{ secrets.SNAILWEB_DEPLOY_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY_SNAILWEB }}
          proxy_port: 96

          script: |
            set -euxo pipefail

            echo "--- Starting deployment on SnailFront ---"

            # --- Variable Setup and Validation ---
            OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TO_DEPLOY="${{ env.REGISTRY }}/${OWNER_LOWERCASE}/${{ env.IMAGE_NAME }}:latest"
            export CONTAINER_NAME="minois-frontend"
            export API_URL_ENV="${{ secrets.API_URL_SNAILFRONT }}"
            export GHCR_USERNAME="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"

            # Validation des variables critiques
            if [ -z "$API_URL_ENV" ]; then
              echo "Error: Le secret API_URL_SNAILFRONT n'est pas défini. Annulation du déploiement."
              echo "Valeur actuelle: '$API_URL_ENV'"
              exit 1
            fi

            if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
              echo "Error: Les credentials GitHub Container Registry ne sont pas définis."
              exit 1
            fi

            echo "Configuration validée:"
            echo "- Image: $IMAGE_TO_DEPLOY"
            echo "- Container: $CONTAINER_NAME"

            # --- Docker Operations ---
            echo "Logging into ${{ env.REGISTRY }}..."
            echo "$GHCR_TOKEN" | docker login ${{ env.REGISTRY }} -u "$GHCR_USERNAME" --password-stdin

            echo "Ensuring application directory exists..."
            mkdir -p ${{ env.APP_DIR_SNAILFRONT }}
            cd ${{ env.APP_DIR_SNAILFRONT }}

            # --- Configuration via .env file ---
            echo "Creating .env file for Docker Compose..."
            cat << EOF > .env
            # This file is auto-generated by the CI/CD pipeline
            IMAGE_TO_DEPLOY=${{ env.REGISTRY }}/${OWNER_LOWERCASE}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
            CONTAINER_NAME=minois-frontend
            API_URL_ENV=${{ secrets.API_URL_SNAILFRONT }}
            EOF

            echo "Creating docker-compose.yml..."
            cat << 'EOF' > docker-compose.yml
            services:
              minois-frontend:
                image: ${IMAGE_TO_DEPLOY}
                container_name: ${CONTAINER_NAME}
                restart: unless-stopped
                ports:
                  - "80:80"
                environment:
                  - API_URL=${API_URL_ENV}
                healthcheck:
                  test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80" ]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
            EOF

            # --- Docker Operations ---
            echo "Logging into ${{ env.REGISTRY }}..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            echo "Pulling the new image..."
            docker compose pull

            echo "Stopping and restarting container..."
            docker compose up -d --force-recreate --remove-orphans

            echo "Cleaning up old Docker images..."
            docker image prune -f

            echo "Logging out from ${{ env.REGISTRY }}..."
            docker logout ${{ env.REGISTRY }}

            echo "--- Deployment finished successfully ---"