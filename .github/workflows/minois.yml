name: Build and Deploy SnailFront

on:
  push:
    branches:
      - staging

env:
  # Nom de l'image Docker. Utilise le nom du dépôt pour être réutilisable.
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Nécessaire pour pousser l'image sur GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }} # Utilise le token standard de GHCR

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Spécifie le Dockerfile à utiliser si ce n'est pas celui à la racine
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Passe les arguments de build au Dockerfile
          build-args: |
            VITE_REACT_APP_HARVARD_MUSEUM_API=${{ secrets.VITE_REACT_APP_HARVARD_MUSEUM_API }}

  deploy:
    name: Deploy to SnailFront VM
    runs-on: ubuntu-latest
    needs: build-and-push # Ce job ne se lance que si le build a réussi

    steps:
      - name: Deploy to SnailFront via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_SNAILFRONT }}
          username: ${{ secrets.SSH_USER_SNAILFRONT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SNAILFRONT }}
          script: |
            # Script exécuté sur la VM SnailFront
            set -euxo pipefail # Arrête le script en cas d'erreur

            # Variables
            APP_DIR="${{ secrets.LINK_SNAILFRONT }}"
            IMAGE_TO_DEPLOY="ghcr.io/${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="minois-frontend"
            API_URL_ENV="${{ secrets.API_URL_SNAILFRONT }}" # Secret pour l'URL de l'API backend

            echo "--- Début du déploiement sur SnailFront ---"

            # Connexion au GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Création du répertoire de l'application
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Création du fichier docker-compose.yml
            echo "Création de docker-compose.yml..."
            cat << EOF > docker-compose.yml

services:
  minois-frontend:
    image: ${IMAGE_TO_DEPLOY}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_URL=${API_URL_ENV}
  EOF
  
  echo "Pull de la nouvelle image..."
  docker compose pull
  
  echo "Redémarrage du conteneur..."
  docker compose up -d --remove-orphans
  
  echo "Nettoyage des anciennes images..."
  docker image prune -af
  
  echo "Déconnexion de GHCR..."
  docker logout ghcr.io
  
  echo "--- Déploiement terminé avec succès ---"