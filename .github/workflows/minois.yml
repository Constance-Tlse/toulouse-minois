name: Deploy Minois Front-End

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: toulouse-minois
  APP_DIR_SNAILFRONT: /home/deployer-front/minois

jobs:
  build:
    name: minois-front-end-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.Minois_deploy }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_REACT_APP_HARVARD_MUSEUM_API=${{ secrets.VITE_REACT_APP_HARVARD_MUSEUM_API }}

  # --- JOB 2: Déployer l'image sur la VM finale ---
  deploy:
    name: Deploy to SnailFront
    runs-on: ubuntu-latest
    needs: build # Ce job ne se lance que si le job 'build' a réussi

    steps:
      - name: Deploy to SnailFront via SnailWeb (Jump Host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # --- Connexion à la VM cible (SnailFront) ---
          host: ${{ secrets.SNAILFRONT_PRIVATE_IP }}
          username: ${{ secrets.SNAILFRONT_DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SNAILFRONT }} # Clé pour la machine FINALE
          port: 22

          # --- Configuration du Proxy/Bastion (SnailWeb) ---
          proxy_host: ${{ secrets.SNAILWEB_HOST }}
          proxy_username: ${{ secrets.SNAILWEB_DEPLOY_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY_SNAILWEB }} # Clé pour le BASTION
          proxy_port: 96

          # --- Script à exécuter sur la VM FINALE (SnailFront) ---
          script: |
            set -euxo pipefail # Arrête le script à la moindre erreur

            echo "--- Début du déploiement sur SnailFront ---"

            # Variables pour plus de clarté
            # CORRECTION ICI : On reconstruit le nom de l'image correctement
            IMAGE_TO_DEPLOY="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="minois-frontend"
            API_URL_ENV="${{ secrets.API_URL_SNAILFRONT }}" # Secret pour l'URL du backend

            # Connexion sécurisée au GitHub Container Registry
            echo "${{ secrets.Minois_deploy }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # Création du répertoire de l'application
            mkdir -p ${{ env.APP_DIR_SNAILFRONT }}
            cd ${{ env.APP_DIR_SNAILFRONT }}

            # Création du fichier docker-compose.yml directement sur le serveur
            echo "Création de docker-compose.yml..."
            cat << EOF > docker-compose.yml
            version: '3.8'
            services:
              minois-frontend:
                image: ${IMAGE_TO_DEPLOY}
                container_name: ${CONTAINER_NAME}
                restart: unless-stopped
                ports:
                  - "80:80"
                environment:
                  - API_URL=${API_URL_ENV}
            EOF

            echo "Pull de la nouvelle image..."
            docker compose pull

            echo "Redémarrage du conteneur avec la nouvelle image..."
            docker compose up -d --remove-orphans

            echo "Nettoyage des anciennes images Docker non utilisées..."
            docker image prune -af

            echo "Déconnexion de GHCR..."
            docker logout ${{ env.REGISTRY }}

            echo "--- Déploiement terminé avec succès ---"